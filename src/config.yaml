site:
  name: "Daniel Avella Ordonez"
  url: "https://danielavellaordonez.com"
  trailingSlash: false

metadata:
  title:
    default: "Personal Homepage"
    template: "%s — Daniel Avella Ordonez"
  openGraph:
    site_name: "Daniel Avella Ordonez"
    # Optional global fallback image; page-level `/og.jpg` still wins on the home page
    images:
      - "/og.jpg"
  twitter:
    card: "summary_large_image"
    # creator: "@yourhandle"  # optional


i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
