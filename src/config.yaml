site:
  name: "Daniel Avella Ordonez"
  url: "https://danielavellaordonez.com"
  trailingSlash: false

metadata:
  title:
    default: "Personal Homepage"
    template: "%s — Daniel Avella Ordonez"
  openGraph:
    site_name: "Daniel Avella Ordonez"
    # Optional global fallback image; page-level `/og.jpg` still wins on the home page
    images:
      - "/og.jpg"
  twitter:
    card: "summary_large_image"
    # creator: "@yourhandle"  # optional


i18n:
  language: en
  textDirection: ltr

app:
  blog:
    isEnabled: false
    list:
      isEnabled: false
    post:
      isEnabled: false
    category:
      isEnabled: false
    tag:
      isEnabled: false


    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
