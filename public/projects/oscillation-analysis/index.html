    :root {
      --bg: #0a0a0a;
      --panel: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.12);
      --text: #fff;
      --muted: rgba(255,255,255,0.75);
      --accent: #ef4444; /* red-500 */
    }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(20px, 3.5vw, 28px); font-weight: 700; }
    .sub { color: var(--muted); margin-bottom: 16px; font-size: 14px; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 10px;
    }
    @media (max-width: 900px) {
      .controls { grid-template-columns: 1fr; }
    }

    #searchBox, #signalList {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
    }
    #signalList {
      height: 420px;
    }

    .viewer {
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 120px;
      padding: 16px;
      overflow: auto;
    }
    .muted { color: var(--muted); font-size: 14px; }

    .bar {
      display:flex; align-items:center; justify-content:space-between; gap: 10px;
      margin-top: 16px;
    }
    .btn {
      display:inline-flex; align-items:center; gap:8px;
      border:1px solid var(--border);
      background:transparent; color:var(--text);
      padding:8px 12px; border-radius:10px; cursor:pointer;
    }
    .btn:hover { background: rgba(255,255,255,0.08); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>

  <script>
  function filterOptions() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const select = document.getElementById('signalList');
    for (const opt of select.options) {
      opt.style.display = opt.text.toLowerCase().includes(q) ? '' : 'none';
    }
  }

  async function loadSignal(name) {
    const frame   = document.getElementById('plotFrame');
    const content = document.getElementById('content');
    if (!name) name = document.getElementById('signalList').value;
    if (!name) return;

    // ✅ Robust directory base (works with /index.html and without trailing slash)
    const dirPath = location.pathname.endsWith('/')
      ? location.pathname
      : location.pathname.replace(/[^/]*$/, ''); // strip last segment
    const base = new URL(dirPath, location.origin);

    // ✅ Your <option> values already contain ".html" → do NOT add it again
    const filename = name; // e.g. "SCLP...IA_IM.html"

    const sameDirUrl = new URL(encodeURIComponent(filename), base).pathname;
    const signalsUrl = new URL(`signals/${encodeURIComponent(filename)}`, base).pathname;

    try {
      // Try /signals/ subfolder first (if you ever move files there)
      const r1 = await fetch(signalsUrl, { cache: 'no-store' });
      if (r1.ok) {
        content.innerHTML = await r1.text();
        frame.style.display = 'none';
        history.replaceState(null, '', `?signal=${encodeURIComponent(filename)}`);
        return;
      }
      // Then try same folder (your current layout)
      const r2 = await fetch(sameDirUrl, { cache: 'no-store' });
      if (r2.ok) {
        content.innerHTML = await r2.text();
        frame.style.display = 'none';
        history.replaceState(null, '', `?signal=${encodeURIComponent(filename)}`);
        return;
      }
      // Fallback to iframe
      frame.src = sameDirUrl;
      frame.style.display = 'block';
      content.innerHTML = '';
      history.replaceState(null, '', `?signal=${encodeURIComponent(filename)}`);
    } catch {
      frame.src = sameDirUrl;
      frame.style.display = 'block';
      content.innerHTML = '';
      history.replaceState(null, '', `?signal=${encodeURIComponent(filename)}`);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    // ✅ hook up search typing
    document.getElementById('searchBox').addEventListener('input', filterOptions);

    // ✅ load deep-linked signal (?signal=...)
    const params = new URLSearchParams(location.search);
    const existing = params.get('signal');
    if (existing) {
      const select = document.getElementById('signalList');
      for (const opt of select.options) {
        if (opt.value === existing) { select.value = existing; break; }
      }
      loadSignal(existing);
    }
  });
</script>
