  <script>
  (function () {
    // Absolute folder path so we never depend on trailing slashes
    const FOLDER = '/projects/oscillation-analysis/';

    const select = document.getElementById('signalList');
    const search = document.getElementById('searchBox');

    function ensureHtml(name) {
      if (!name) return '';
      const t = name.trim();
      return t.toLowerCase().endsWith('.html') ? t : (t + '.html');
    }

    function go(file) {
      const filename = ensureHtml(file);
      if (!filename) return;
      // Encode just the filename (handles spaces) and navigate
      window.location.assign(FOLDER + encodeURIComponent(filename));
    }

    // navigate when user picks an option
    select.addEventListener('change', () => go(select.value));
    select.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(select.value); });

    // simple search filter
    function filter() {
      const q = (search?.value || '').toLowerCase();
      for (const opt of select.options) opt.hidden = !opt.text.toLowerCase().includes(q);
    }
    if (search) search.addEventListener('input', filter);

    // support direct links like ?signal=FILE.html
    const params = new URLSearchParams(window.location.search);
    const existing = params.get('signal');
    if (existing) {
      const want = ensureHtml(existing);
      for (const opt of select.options) {
        if (ensureHtml(opt.value) === want) { select.value = opt.value; break; }
      }
      go(want);
    }

    // tiny marker so we can confirm in prod
    console.log('viewer v6');
  })();
  </script>
